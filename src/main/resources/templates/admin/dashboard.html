<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Doctors - TeleHealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
    <span class="text-xl font-bold text-blue-600">TeleHealth Admin</span>
    <div class="flex items-center space-x-6 text-sm">
        <a href="/admin/dashboard" class="text-blue-600 font-semibold">Doctors</a>
        <a href="/admin/patients" class="text-gray-600 hover:text-blue-600 font-medium">All Patients</a>
        <a href="/logout" class="text-red-500 hover:underline font-medium">Sign Out</a>
    </div>
</nav>

<main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
    <div th:if="${success}" class="p-3 bg-green-100 text-green-800 rounded-lg text-sm" th:text="${success}"></div>
    <div th:if="${error}" class="p-3 bg-red-100 text-red-800 rounded-lg text-sm" th:text="${error}"></div>

    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-lg font-bold text-gray-800 mb-4">Register New Doctor</h2>
        <form th:action="@{/admin/doctors/create}" method="POST" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <input type="email" name="email" placeholder="Doctor Email" required class="px-3 py-2 text-sm border border-gray-300 rounded-lg">
            <input type="password" name="tempPassword" placeholder="Temporary Password" required class="px-3 py-2 text-sm border border-gray-300 rounded-lg">
            <input type="text" name="specialty" placeholder="Specialty (e.g. Cardiology)" required class="px-3 py-2 text-sm border border-gray-300 rounded-lg">
            <input type="text" name="firstName" placeholder="First Name" required class="px-3 py-2 text-sm border border-gray-300 rounded-lg">
            <input type="text" name="lastName" placeholder="Last Name" required class="px-3 py-2 text-sm border border-gray-300 rounded-lg">
            <input type="url" name="photoUrl" placeholder="Photo URL (optional)" class="px-3 py-2 text-sm border border-gray-300 rounded-lg">
            <div class="md:col-span-3 flex justify-end">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-6 py-2 rounded-lg transition">
                    Add Doctor
                </button>
            </div>
        </form>
    </section>

    <section>
        <h2 class="text-xl font-bold text-gray-800 mb-4">Registered Doctors</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div th:each="doc : ${doctors}" class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img th:src="${doc.photoUrl != null ? doc.photoUrl : 'https://placehold.co/100x100/2563eb/white?text=MD'}"
                         class="w-12 h-12 rounded-full object-cover">
                    <div>
                        <p class="font-semibold text-gray-800 text-sm" th:text="${'Dr. ' + doc.firstName + ' ' + doc.lastName}">Doctor</p>
                        <p class="text-xs text-blue-600" th:text="${doc.specialty}">Specialty</p>
                    </div>
                </div>
                <a th:href="@{/admin/confirm-delete(targetType='DOCTOR', targetId=${doc.doctorId}, targetLabel=${'Dr. ' + doc.firstName + ' ' + doc.lastName})}"
                   class="text-xs font-semibold text-red-600 hover:bg-red-50 px-3 py-1.5 rounded-lg border border-red-200">
                    Remove
                </a>
            </div>
        </div>
    </section>
</main>

</body>
</html>

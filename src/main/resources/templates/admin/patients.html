<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Patients - TeleHealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
    <span class="text-xl font-bold text-blue-600">TeleHealth Admin</span>
    <div class="flex items-center space-x-6 text-sm">
        <a href="/admin/dashboard" class="text-gray-600 hover:text-blue-600 font-medium">Doctors</a>
        <a href="/admin/patients" class="text-blue-600 font-semibold">All Patients</a>
        <a href="/logout" class="text-red-500 hover:underline font-medium">Sign Out</a>
    </div>
</nav>

<main class="max-w-5xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Registered Patient Accounts</h2>

    <div th:if="${success}" class="mb-4 p-3 bg-green-100 text-green-800 rounded-lg text-sm" th:text="${success}"></div>
    <div th:if="${error}" class="mb-4 p-3 bg-red-100 text-red-800 rounded-lg text-sm" th:text="${error}"></div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 text-gray-600 border-b border-gray-100">
            <tr>
                <th class="px-6 py-3">Account ID</th>
                <th class="px-6 py-3">Email</th>
                <th class="px-6 py-3 text-right">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="patient : ${patients}">
                <td class="px-6 py-4 font-mono text-xs text-gray-600" th:text="${patient.id}">uuid</td>
                <td class="px-6 py-4 font-medium text-gray-800" th:text="${patient.email}">email</td>
                <td class="px-6 py-4 text-right">
                    <a th:href="@{/admin/confirm-delete(targetType='PATIENT', targetId=${patient.id}, targetLabel=${patient.email})}"
                       class="text-xs font-semibold text-red-600 hover:bg-red-50 px-3 py-1.5 rounded-lg border border-red-200">
                        Revoke & Delete
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(patients)}">
                <td colspan="3" class="px-6 py-8 text-center text-gray-500">No patient accounts found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>

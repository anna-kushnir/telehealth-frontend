<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirm Deletion - TeleHealth Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-red-100">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Confirm Account Removal</h2>
    <p class="text-sm text-gray-500 text-center mb-6">
        A verification code has been sent to the admin email. Confirm removal of <strong th:text="${targetLabel}">user</strong>.
    </p>

    <form th:action="@{/admin/confirm-delete}" method="POST" class="space-y-4">
        <input type="hidden" name="targetType" th:value="${targetType}">
        <input type="hidden" name="targetId" th:value="${targetId}">

        <div class="grid grid-cols-3 gap-3 items-center">
            <label for="otpCode" class="text-right text-sm font-medium text-gray-700">Verification Code:</label>
            <input type="text" id="otpCode" name="otpCode" required maxlength="6" placeholder="000000"
                   class="col-span-2 px-3 py-2 border border-gray-300 rounded-lg text-center tracking-widest font-mono text-lg focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <div class="flex items-center justify-center space-x-3 mt-6">
            <a th:href="${targetType == 'DOCTOR' ? '/admin/dashboard' : '/admin/patients'}"
               class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg text-center transition">
                Cancel
            </a>
            <button type="submit" class="w-1/2 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition shadow-md">
                Confirm Delete
            </button>
        </div>
    </form>
</div>

</body>
</html>

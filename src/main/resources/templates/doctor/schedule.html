<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Working Days - TeleHealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
    <span class="text-xl font-bold text-blue-600">TeleHealth Doctor</span>
    <div class="flex items-center space-x-6 text-sm">
        <a href="/doctor/dashboard" class="text-gray-600 hover:text-blue-600 font-medium">Upcoming Appointments</a>
        <a href="/doctor/schedule" class="text-blue-600 font-semibold">Add Working Days</a>
        <a href="/doctor/history" class="text-gray-600 hover:text-blue-600 font-medium">Appointment History</a>
        <a href="/security/mfa" class="text-gray-600 hover:text-blue-600 font-medium">MFA Settings</a>
        <a href="/logout" class="text-red-500 hover:underline font-medium">Sign Out</a>
    </div>
</nav>

<main class="max-w-2xl mx-auto px-4 py-10">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Configure Working Schedule</h2>

        <div th:if="${error}" class="mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg" th:text="${error}"></div>

        <form th:action="@{/doctor/schedule}" method="POST" class="space-y-4">
            <div class="grid grid-cols-3 gap-3 items-center">
                <label class="text-right text-sm font-medium text-gray-700">Start Date:</label>
                <input type="date" name="startDate" required class="col-span-2 px-3 py-2 border border-gray-300 rounded-lg">
            </div>

            <div class="grid grid-cols-3 gap-3 items-center">
                <label class="text-right text-sm font-medium text-gray-700">End Date:</label>
                <input type="date" name="endDate" required class="col-span-2 px-3 py-2 border border-gray-300 rounded-lg">
            </div>

            <div class="grid grid-cols-3 gap-3 items-center">
                <label class="text-right text-sm font-medium text-gray-700">Slot Duration (min):</label>
                <input type="number" name="slotDurationMinutes" value="30" min="5" required
                       class="col-span-2 px-3 py-2 border border-gray-300 rounded-lg">
            </div>

            <div class="pt-3 border-t border-gray-100 space-y-2.5">
                <p class="text-sm font-semibold text-gray-700 mb-2">Weekly Shift Hours:</p>
                <div th:each="day : ${daysOfWeek}" class="grid grid-cols-4 gap-2 items-center text-sm">
                    <label class="flex items-center gap-2 font-medium text-gray-700">
                        <input type="checkbox" th:name="${'enabled_' + day}" value="true"
                               th:checked="${day != 'SATURDAY' and day != 'SUNDAY'}" class="rounded text-blue-600">
                        <span th:text="${day}">MONDAY</span>
                    </label>
                    <input type="time" th:name="${'start_' + day}" value="09:00" class="px-2 py-1.5 border border-gray-300 rounded-lg">
                    <input type="time" th:name="${'end_' + day}" value="17:00" class="px-2 py-1.5 border border-gray-300 rounded-lg">
                    <span class="text-xs text-gray-400">Shift window</span>
                </div>
            </div>

            <div class="flex justify-center space-x-3 pt-4">
                <a href="/doctor/dashboard" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg text-center transition">Cancel</a>
                <button type="submit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition shadow-md">
                    Generate Slots
                </button>
            </div>
        </form>
    </div>
</main>

</body>
</html>

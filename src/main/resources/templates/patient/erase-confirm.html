<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erase Personal Data - TeleHealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-red-100">
    <h2 class="text-2xl font-bold text-center text-red-600 mb-2">Right to Erasure (GDPR)</h2>
    <p class="text-sm text-gray-600 text-center mb-6">
        A confirmation code has been sent to your email. Confirming this action will destroy your encryption keys (Crypto-Shredding) and permanently erase your account.
    </p>

    <div th:if="${error}" class="mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg text-center" th:text="${error}"></div>

    <form th:action="@{/patient/erase-data}" method="POST" class="space-y-4">
        <div class="grid grid-cols-3 gap-3 items-center">
            <label for="code" class="text-right text-sm font-medium text-gray-700">Email Code:</label>
            <input type="text" id="code" name="code" required maxlength="6" placeholder="000000"
                   class="col-span-2 px-3 py-2 border border-gray-300 rounded-lg text-center tracking-widest font-mono text-lg focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <div class="flex items-center justify-center space-x-3 mt-6">
            <a href="/patient/dashboard" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg text-center transition">
                Cancel
            </a>
            <button type="submit" class="w-1/2 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition shadow-md">
                Erase Data
            </button>
        </div>
    </form>
</div>

</body>
</html>

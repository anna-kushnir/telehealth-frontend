<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>2FA Required - TeleHealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-amber-200 text-center space-y-5">
    <div class="w-12 h-12 mx-auto rounded-full bg-amber-100 text-amber-600 flex items-center justify-center font-bold text-xl">
        !
    </div>
    <h2 class="text-xl font-bold text-gray-800">Two-Factor Authentication Required</h2>
    <p class="text-sm text-gray-600">
        To view sensitive medical records or manage doctor access consents, please enable Two-Factor Authentication (2FA) in your account settings and sign in again.
    </p>

    <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <a href="/patient/dashboard" class="w-full sm:w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg transition text-sm">
            Back to Dashboard
        </a>
        <form th:action="@{/patient/2fa}" method="POST" class="w-full sm:w-1/2">
            <input type="hidden" name="enabled" value="true">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition text-sm shadow-sm">
                Enable 2FA Now
            </button>
        </form>
    </div>
</div>

</body>
</html>

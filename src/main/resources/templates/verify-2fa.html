<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verification - TeleHealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Two-Factor Authentication</h2>
    <p class="text-sm text-gray-500 text-center mb-6">Enter the verification code from your email or Authenticator app</p>

    <div th:if="${error}" class="mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg text-center" th:text="${error}"></div>

    <form th:action="@{/verify-2fa}" method="POST" class="space-y-4">

        <div class="grid grid-cols-3 gap-3 items-center">
            <label for="code" class="text-right text-sm font-medium text-gray-700">Verification Code:</label>
            <input type="text" id="code" name="code" required maxlength="6" placeholder="000000"
                   class="col-span-2 px-3 py-2 border border-gray-300 rounded-lg text-center tracking-widest font-mono text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex items-center justify-center space-x-3 mt-6">
            <a href="/login" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg text-center transition duration-200">
                Cancel
            </a>
            <button type="submit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 shadow-md">
                Continue
            </button>
        </div>

    </form>
</div>

</body>
</html>
